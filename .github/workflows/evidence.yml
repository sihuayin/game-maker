name: evidence

# P0-04-05：双基线可信证据。
# 可信执行逻辑（workflow / CLI / scripts / registry / manifests / anchors / update logs）全部来自受保护 base；
# PR head 只作为不可信数据被读取，绝不执行。
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    name: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Assert PR base is main
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          test "$BASE_REF" = "main" || {
            echo "::error::base branch is '$BASE_REF'; this gate only protects main"
            exit 1
          }

      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout: |
            packages
            scripts
            .scratch/baselines
            .scratch/evidence-integrity-v1/manifest
            .scratch/p0-02-second-demo-v2/manifest

      - name: Checkout PR head as data only
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          allow-unsafe-pr-checkout: true
          sparse-checkout: |
            .scratch/baselines
            .scratch/evidence-integrity-v1/manifest
            .scratch/fpvs-v1-final/work
            .scratch/fpvs-v1-final/artifacts
            .scratch/fpvs-v1-final/runs
            .scratch/generic-playtest-v1/evidence
            .scratch/p0-02-second-demo-v2/manifest
            .scratch/p0-02-second-demo-v2/freeze

      - name: Verify PR head did not move during checkout
        working-directory: pr
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if [ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::error::PR head moved or checkout mismatch: expected $EXPECTED_HEAD, got $ACTUAL_HEAD"
            exit 1
          fi

      - name: Materialize base and head freeze hash lists
        run: |
          set -euo pipefail
          BASE_FREEZE="$GITHUB_WORKSPACE/base/.scratch/p0-02-second-demo-v2/freeze-sha256.txt"
          PR_FREEZE="$GITHUB_WORKSPACE/pr/.scratch/p0-02-second-demo-v2/freeze-sha256.txt"
          mkdir -p "$(dirname "$BASE_FREEZE")" "$(dirname "$PR_FREEZE")"
          git -C "$GITHUB_WORKSPACE/base" show "HEAD:.scratch/p0-02-second-demo-v2/freeze-sha256.txt" > "$BASE_FREEZE"
          git -C "$GITHUB_WORKSPACE/pr" show "HEAD:.scratch/p0-02-second-demo-v2/freeze-sha256.txt" > "$PR_FREEZE"
          test -s "$BASE_FREEZE"
          test -s "$PR_FREEZE"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml

      - name: Validate trusted baseline configuration
        env:
          BASE: ${{ github.workspace }}/base
          PR: ${{ github.workspace }}/pr
          BASE_REGISTRY: ${{ github.workspace }}/base/.scratch/baselines/registry.json
          PR_REGISTRY: ${{ github.workspace }}/pr/.scratch/baselines/registry.json
          A_MANIFEST_BASE: ${{ github.workspace }}/base/.scratch/evidence-integrity-v1/manifest/expected-hashes.json
          A_MANIFEST_PR: ${{ github.workspace }}/pr/.scratch/evidence-integrity-v1/manifest/expected-hashes.json
          B_MANIFEST_BASE: ${{ github.workspace }}/base/.scratch/p0-02-second-demo-v2/manifest/final-manifest.json
          B_MANIFEST_PR: ${{ github.workspace }}/pr/.scratch/p0-02-second-demo-v2/manifest/final-manifest.json
          B_ANCHOR_BASE: ${{ github.workspace }}/base/.scratch/p0-02-second-demo-v2/manifest/expected-hashes.sha256
          B_ANCHOR_PR: ${{ github.workspace }}/pr/.scratch/p0-02-second-demo-v2/manifest/expected-hashes.sha256
          B_LOG_BASE: ${{ github.workspace }}/base/.scratch/p0-02-second-demo-v2/manifest/MANIFEST-UPDATES.md
          B_LOG_PR: ${{ github.workspace }}/pr/.scratch/p0-02-second-demo-v2/manifest/MANIFEST-UPDATES.md
          B_FREEZE_BASE: ${{ github.workspace }}/base/.scratch/p0-02-second-demo-v2/freeze-sha256.txt
          B_FREEZE_PR: ${{ github.workspace }}/pr/.scratch/p0-02-second-demo-v2/freeze-sha256.txt
        run: |
          set -euo pipefail
          for f in "$BASE_REGISTRY" "$PR_REGISTRY" "$A_MANIFEST_BASE" "$A_MANIFEST_PR" \
                   "$B_MANIFEST_BASE" "$B_MANIFEST_PR" "$B_ANCHOR_BASE" "$B_ANCHOR_PR" \
                   "$B_LOG_BASE" "$B_LOG_PR" "$B_FREEZE_BASE" "$B_FREEZE_PR"; do
            test -f "$f" || { echo "::error::missing required trusted input: $f"; exit 1; }
          done
          node "$BASE/scripts/validate-baseline-registry.mjs" \
            --registry "$BASE_REGISTRY" --repo-root "$BASE" \
            --require-ids fpvs-v1,p0-02-second-demo-v2 --exact-ids
          node "$BASE/scripts/check-baseline-updates.mjs" --registry "$BASE_REGISTRY" --repo-root "$BASE"
          cmp -s "$BASE_REGISTRY" "$PR_REGISTRY" || { echo "::error::PR registry differs from base registry; ordinary PRs may not change baseline configuration."; exit 1; }
          cmp -s "$A_MANIFEST_BASE" "$A_MANIFEST_PR" || { echo "::error::A Manifest differs from base Manifest; ordinary PRs may not change expected values."; exit 1; }
          cmp -s "$B_MANIFEST_BASE" "$B_MANIFEST_PR" || { echo "::error::B Manifest differs from base Manifest; ordinary PRs may not change expected values."; exit 1; }
          cmp -s "$B_ANCHOR_BASE" "$B_ANCHOR_PR" || { echo "::error::B Anchor differs from base Anchor; ordinary PRs may not change trust anchors."; exit 1; }
          cmp -s "$B_LOG_BASE" "$B_LOG_PR" || { echo "::error::B update log differs from base; ordinary PRs may not change trust configuration."; exit 1; }
          cmp -s "$B_FREEZE_BASE" "$B_FREEZE_PR" || { echo "::error::B freeze hash list differs from base; ordinary PRs may not change frozen snapshot identity."; exit 1; }

      - name: Build trusted base CLI
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify baseline A
        id: verify-a
        env:
          BASE: ${{ github.workspace }}/base
          PR: ${{ github.workspace }}/pr
          OUT_A: ${{ runner.temp }}/evidence-a
          A_MANIFEST_BASE: ${{ github.workspace }}/base/.scratch/evidence-integrity-v1/manifest/expected-hashes.json
          A_MANIFEST_PR: ${{ github.workspace }}/pr/.scratch/evidence-integrity-v1/manifest/expected-hashes.json
          A_ANCHOR_BASE: ${{ github.workspace }}/base/.scratch/evidence-integrity-v1/manifest/expected-hashes.sha256
        run: |
          set -euo pipefail
          A_DIGEST="$(tr -d '\r\n' < "$A_ANCHOR_BASE")"
          mkdir -p "$OUT_A"
          node "$BASE/scripts/evidence-acceptance.mjs" \
            --manifest "$A_MANIFEST_PR" \
            --expected-manifest-sha "$A_DIGEST" \
            --base-manifest "$A_MANIFEST_BASE" \
            --baseline-id fpvs-v1 \
            --out "$OUT_A"
          SUMMARY="$(ls -1t "$OUT_A"/*-test-evidence/summary.json | head -n 1)"
          REPORT="$(ls -1t "$OUT_A"/*-delivery-verification/report.json | head -n 1)"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Verify baseline B
        id: verify-b
        if: always()
        env:
          BASE: ${{ github.workspace }}/base
          PR: ${{ github.workspace }}/pr
          OUT_B: ${{ runner.temp }}/evidence-b
          B_MANIFEST_BASE: ${{ github.workspace }}/base/.scratch/p0-02-second-demo-v2/manifest/final-manifest.json
          B_MANIFEST_PR: ${{ github.workspace }}/pr/.scratch/p0-02-second-demo-v2/manifest/final-manifest.json
          B_ANCHOR_BASE: ${{ github.workspace }}/base/.scratch/p0-02-second-demo-v2/manifest/expected-hashes.sha256
        run: |
          set -euo pipefail
          B_DIGEST="$(tr -d '\r\n' < "$B_ANCHOR_BASE")"
          mkdir -p "$OUT_B"
          node "$BASE/scripts/evidence-acceptance.mjs" \
            --manifest "$B_MANIFEST_PR" \
            --expected-manifest-sha "$B_DIGEST" \
            --base-manifest "$B_MANIFEST_BASE" \
            --anchor-mode digest+base \
            --baseline-id p0-02-second-demo-v2 \
            --out "$OUT_B"
          SUMMARY="$(ls -1t "$OUT_B"/*-test-evidence/summary.json | head -n 1)"
          REPORT="$(ls -1t "$OUT_B"/*-delivery-verification/report.json | head -n 1)"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Verify baseline B freeze snapshot
        id: verify-b-freeze
        if: always()
        env:
          BASE: ${{ github.workspace }}/base
          PR: ${{ github.workspace }}/pr
          BASE_REGISTRY: ${{ github.workspace }}/base/.scratch/baselines/registry.json
          OUT_B: ${{ runner.temp }}/evidence-b
        run: |
          set -euo pipefail
          mkdir -p "$OUT_B"
          node "$BASE/scripts/verify-freeze-snapshot.mjs" \
            --registry "$BASE_REGISTRY" \
            --baseline-id p0-02-second-demo-v2 \
            --repo-root "$BASE" \
            --head-root "$PR" \
            --out "$OUT_B/freeze-verification.json"

      - name: Aggregate dual-baseline results
        id: aggregate
        if: always()
        env:
          BASE: ${{ github.workspace }}/base
          BASE_REGISTRY: ${{ github.workspace }}/base/.scratch/baselines/registry.json
          A_OUTCOME: ${{ steps.verify-a.outcome }}
          B_OUTCOME: ${{ steps.verify-b.outcome }}
          B_FREEZE_OUTCOME: ${{ steps.verify-b-freeze.outcome }}
          A_SUMMARY: ${{ steps.verify-a.outputs.summary }}
          B_SUMMARY: ${{ steps.verify-b.outputs.summary }}
          A_REPORT: ${{ steps.verify-a.outputs.report }}
          B_REPORT: ${{ steps.verify-b.outputs.report }}
          A_MANIFEST_PR: ${{ github.workspace }}/pr/.scratch/evidence-integrity-v1/manifest/expected-hashes.json
          B_MANIFEST_PR: ${{ github.workspace }}/pr/.scratch/p0-02-second-demo-v2/manifest/final-manifest.json
          B_FREEZE_JSON: ${{ runner.temp }}/evidence-b/freeze-verification.json
          OUT_AGG: ${{ runner.temp }}/evidence-aggregate
        run: |
          set -euo pipefail
          mkdir -p "$OUT_AGG"
          node "$BASE/scripts/dual-baseline-aggregate.mjs" \
            --registry "$BASE_REGISTRY" \
            --repo-root "$BASE" \
            --a-outcome "$A_OUTCOME" \
            --b-outcome "$B_OUTCOME" \
            --b-freeze-outcome "$B_FREEZE_OUTCOME" \
            --a-summary "$A_SUMMARY" \
            --b-summary "$B_SUMMARY" \
            --a-report "$A_REPORT" \
            --b-report "$B_REPORT" \
            --a-manifest "$A_MANIFEST_PR" \
            --b-manifest "$B_MANIFEST_PR" \
            --b-freeze "$B_FREEZE_JSON" \
            --out "$OUT_AGG/aggregate.json"

      - name: Upload baseline A artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-a-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/evidence-a
          retention-days: 30
          if-no-files-found: error

      - name: Upload baseline B artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-b-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/evidence-b
          retention-days: 30
          if-no-files-found: error

      - name: Upload dual-baseline aggregate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-aggregate-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/evidence-aggregate
          retention-days: 30
          if-no-files-found: error
