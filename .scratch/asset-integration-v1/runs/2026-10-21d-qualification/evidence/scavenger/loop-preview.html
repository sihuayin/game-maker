<!doctype html><meta charset="utf-8"><title>scavenger-actor qualification preview</title>
<style>body{font-family:system-ui;background:#1b1b1b;color:#ddd;margin:24px}img{image-rendering:pixelated;background:#333;border:1px solid #555}div{display:inline-block;margin:8px}small{color:#aaa}</style>
<h2>scavenger-actor · qualification sample (3 frames, not full loop)</h2>
<div><div><small>2.5 baseline</small><br><img id="b" width="384" height="512"></div>
<div><small>3 Pro candidate</small><br><img id="c" width="384" height="512"></div></div>
<script>
const b=["baseline-imported/scavenger-actor.idle1.png","baseline-imported/scavenger-actor.idle2.png","baseline-imported/scavenger-actor.idle4.png"];
const c=["imported/scavenger-actor.idle1.png","imported/scavenger-actor.idle2.png","imported/scavenger-actor.idle4.png"];
const fps=6; let i=0;
const bi=document.getElementById('b'), ci=document.getElementById('c');
const tick=()=>{bi.src=b[i% b.length];ci.src=c[i% c.length];i++;}; tick(); setInterval(tick,1000/fps);
</script>
