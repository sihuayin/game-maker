<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>玩家走路动画预览</title>
<style>body{margin:0;padding:26px;background:#14181a;color:#dfe6e2;font:14px/1.6 -apple-system,"PingFang SC",sans-serif}
h1{font-size:19px;margin:0 0 3px}.sub{color:#8b9a94;font-size:12.5px;margin-bottom:18px}
.stage{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.box{background:#1b2124;border:1px solid #2c3538;border-radius:6px;padding:14px;text-align:center}
.box .cap{font:12px Menlo,monospace;color:#8b9a94;margin-top:8px}

.row{margin:16px 0}</style></head><body>
<h1>玩家角色 · 走路循环动画</h1>
<div class="sub">test.png 风格 → 单次调用生成六帧 · 左：循环播放 · 右：六帧全览</div>
<div class="row">
 <button id="bPlay" class="on">▶ 播放</button><button id="bStop">■ 停</button>
 <button data-fps="4">4 fps</button><button data-fps="8" class="on">8 fps</button><button data-fps="12">12 fps</button>
 <button id="bPrev">◀ 上一帧</button><button id="bNext">下一帧 ▶</button>
</div>
<div class="stage">
 <div class="box"><canvas id="anim" width="192" height="256"></canvas><div class="cap" id="cap">walk1</div></div>
 <div class="box"><canvas id="all" width="1200" height="256"></canvas><div class="cap">idle / walk1-4 / jump</div></div>
</div>
<script>
const PAL=["#7C968E","#55685F","#A9B7AC","#3E3236","#C3CDC9","#EAD8A6","#C4694A","#4EBBA4","#6D8F52"], FR={"idle":[{"op":"rect","x":9,"y":2,"w":6,"h":4,"fill":"palette:5","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":8,"y":6,"w":8,"h":7,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":13,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":9,"y":13,"w":6,"h":7,"fill":"palette:1","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":15,"w":4,"h":3,"fill":"palette:7","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":9,"y":19,"w":6,"h":2,"fill":"palette:6","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":7,"y":13,"w":2,"h":6,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":15,"y":13,"w":2,"h":6,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":9,"y":20,"w":2,"h":6,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":13,"y":20,"w":2,"h":6,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":8,"y":26,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":13,"y":26,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":11,"y":6,"w":2,"h":1,"fill":"palette:5"}],"walk1":[{"op":"rect","x":9,"y":2,"w":6,"h":4,"fill":"palette:5","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":8,"y":6,"w":8,"h":7,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":13,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":9,"y":13,"w":6,"h":7,"fill":"palette:1","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":15,"w":4,"h":3,"fill":"palette:7","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":9,"y":19,"w":6,"h":2,"fill":"palette:6","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":6,"y":13,"w":2,"h":6,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":16,"y":13,"w":2,"h":6,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":8,"y":20,"w":2,"h":6,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":14,"y":20,"w":2,"h":6,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":7,"y":26,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":14,"y":26,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":11,"y":6,"w":2,"h":1,"fill":"palette:5"}],"walk2":[{"op":"rect","x":9,"y":2,"w":6,"h":4,"fill":"palette:5","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":8,"y":6,"w":8,"h":7,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":13,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":9,"y":13,"w":6,"h":7,"fill":"palette:1","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":15,"w":4,"h":3,"fill":"palette:7","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":9,"y":19,"w":6,"h":2,"fill":"palette:6","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":7,"y":13,"w":2,"h":6,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":15,"y":13,"w":2,"h":6,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":9,"y":20,"w":2,"h":6,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":13,"y":20,"w":2,"h":6,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":8,"y":26,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":13,"y":26,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":11,"y":6,"w":2,"h":1,"fill":"palette:5"}],"walk3":[{"op":"rect","x":9,"y":2,"w":6,"h":4,"fill":"palette:5","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":8,"y":6,"w":8,"h":7,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":13,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":9,"y":13,"w":6,"h":7,"fill":"palette:1","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":15,"w":4,"h":3,"fill":"palette:7","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":9,"y":19,"w":6,"h":2,"fill":"palette:6","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":16,"y":13,"w":2,"h":6,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":6,"y":13,"w":2,"h":6,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":14,"y":20,"w":2,"h":6,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":8,"y":20,"w":2,"h":6,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":14,"y":26,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":7,"y":26,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":11,"y":6,"w":2,"h":1,"fill":"palette:5"}],"walk4":[{"op":"rect","x":9,"y":2,"w":6,"h":4,"fill":"palette:5","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":8,"y":6,"w":8,"h":7,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":13,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":9,"y":13,"w":6,"h":7,"fill":"palette:1","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":15,"w":4,"h":3,"fill":"palette:7","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":9,"y":19,"w":6,"h":2,"fill":"palette:6","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":15,"y":13,"w":2,"h":6,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":7,"y":13,"w":2,"h":6,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":13,"y":20,"w":2,"h":6,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":9,"y":20,"w":2,"h":6,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":13,"y":26,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":8,"y":26,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":11,"y":6,"w":2,"h":1,"fill":"palette:5"}],"jump":[{"op":"rect","x":9,"y":2,"w":6,"h":4,"fill":"palette:5","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":8,"y":6,"w":8,"h":7,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":13,"y":9,"w":1,"h":1,"fill":"palette:3"},{"op":"rect","x":9,"y":13,"w":6,"h":7,"fill":"palette:1","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":10,"y":15,"w":4,"h":3,"fill":"palette:7","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":9,"y":19,"w":6,"h":2,"fill":"palette:6","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":6,"y":12,"w":2,"h":5,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":16,"y":12,"w":2,"h":5,"fill":"palette:4","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":8,"y":20,"w":2,"h":4,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":14,"y":20,"w":2,"h":4,"fill":"palette:2","stroke":"palette:3","strokeWidth":1},{"op":"rect","x":7,"y":24,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":14,"y":24,"w":3,"h":2,"fill":"palette:3"},{"op":"rect","x":11,"y":6,"w":2,"h":1,"fill":"palette:5"}]}, NAMES=["idle","walk1","walk2","walk3","walk4","jump"];
const C=s=>PAL[+s.split(":")[1]]||"#f0f";
function catmull(x,P,closed){x.beginPath();x.moveTo(P[0][0],P[0][1]);
 for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
  x.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);}
 if(closed)x.closePath();}
function draw(x,ops,S,ox,oy){x.save();x.translate(ox,oy);x.scale(S,S);
 for(const op of ops){const F=op.fill&&op.fill!=="none"?C(op.fill):null,S2=op.stroke?C(op.stroke):null;
  x.globalAlpha=op.opacity!=null?op.opacity:1;
  if(op.op==="rect"){if(F){x.fillStyle=F;x.fillRect(op.x,op.y,op.w,op.h);}}
  else if(op.op==="circle"){if(F){x.fillStyle=F;x.beginPath();x.arc(op.cx,op.cy,op.r,0,7);x.fill();}}
  else if(op.op==="ellipse"){if(F){x.fillStyle=F;x.beginPath();x.ellipse(op.cx,op.cy,op.rx,op.ry,0,0,7);x.fill();}}
  else if(op.op==="poly"){if(F){x.fillStyle=F;x.beginPath();op.points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill();}}
  else if(op.op==="line"){if(S2){x.strokeStyle=S2;x.lineWidth=op.strokeWidth||1;x.lineCap="round";x.beginPath();x.moveTo(op.x1,op.y1);x.lineTo(op.x2,op.y2);x.stroke();}}
  else if(op.op==="curve"){if(S2){x.strokeStyle=S2;x.lineWidth=op.strokeWidth||1;x.lineCap="round";catmull(x,op.points,op.closed);x.stroke();}
   if(F){x.fillStyle=F;catmull(x,op.points,op.closed);x.fill();}}
  x.globalAlpha=1;}
 x.restore();}
const a=document.getElementById("anim").getContext("2d"), al=document.getElementById("all").getContext("2d");
const WALK=["walk1","walk2","walk3","walk4"];
let i=0,fps=8,playing=true,cur=null,timer=null;
function frame(){cur=cur||WALK[0];a.clearRect(0,0,192,256);draw(a,FR[cur],8,0,0);document.getElementById("cap").textContent=cur+"  ("+(WALK.indexOf(cur)+1)+"/4)";}
function tick(){i=(i+1)%WALK.length;cur=WALK[i];frame();}
function loop(){clearInterval(timer);if(playing)timer=setInterval(tick,1000/fps);}
al.clearRect(0,0,1200,256);NAMES.forEach((n,k)=>draw(al,FR[n],8,k*200,0));
document.getElementById("bPlay").onclick=()=>{playing=true;loop();};
document.getElementById("bStop").onclick=()=>{playing=false;clearInterval(timer);};
document.getElementById("bNext").onclick=()=>{playing=false;clearInterval(timer);i=(i+1)%WALK.length;cur=WALK[i];frame();};
document.getElementById("bPrev").onclick=()=>{playing=false;clearInterval(timer);i=(i+3)%WALK.length;cur=WALK[i];frame();};
document.querySelectorAll("[data-fps]").forEach(b=>b.onclick=()=>{fps=+b.dataset.fps;
 document.querySelectorAll("[data-fps]").forEach(x=>x.classList.toggle("on",x===b));loop();});
frame();loop();
</script></body></html>
