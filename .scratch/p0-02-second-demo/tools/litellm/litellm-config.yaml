# P0-02 · LiteLLM Proxy 配置模板（不含密钥）
# ⚠️ 这是**起点**，不是已实测配置：LiteLLM 版本/字段可能不同；先按 README 做 max_budget=0 验证。
# ⚠️ 别名用本仓现有模型名，这样 repo 配置只改 baseUrl、不改 model。
# ⚠️ 密钥只从环境变量取；不要把任何 key 写进本文件。

model_list:
  # 本仓 text.model = gemini-3.5-flash；官方已自动路由到 3.6，这里显式映射。
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  # 备用别名：如果 repo 里把 model 写成 3.6，可直接用。
  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  # 本仓 image.model = gemini-3.1-flash-lite-image
  - model_name: gemini-3.1-flash-lite-image
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-image
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: image_generation

litellm_settings:
  drop_params: true
  num_retries: 0
  request_timeout: 600
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
